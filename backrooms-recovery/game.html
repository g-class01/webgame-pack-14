<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Backrooms Recovery</title>
    <script>
    (function() {
        function dummyBreak(fn) {
            if (typeof fn === 'function') {
                try { fn(true); } catch(e) {}
            }
            return Promise.resolve(true);
        }
        window.commercialBreak = window.commercialBreak || dummyBreak;
        window.rewardedBreak = window.rewardedBreak || dummyBreak;
        try {
            if (window.parent && window.parent !== window) {
                window.parent.commercialBreak = window.parent.commercialBreak || dummyBreak;
                window.parent.rewardedBreak = window.parent.rewardedBreak || dummyBreak;
            }
            if (window.top && window.top !== window) {
                window.top.commercialBreak = window.top.commercialBreak || dummyBreak;
                window.top.rewardedBreak = window.top.rewardedBreak || dummyBreak;
            }
        } catch(e) {}
    })();
    </script>
    <script>window.open = function () {}; window.NOSW = true;</script>
    <script src="poki-sdk.js"></script>
    <style>
      html, body {
        padding: 0;
        margin: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: #000;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: #231F20;
        display: block;
      }
      #loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        color: #fff;
        font-family: sans-serif;
        text-align: center;
      }
      .progress-bar {
        width: 200px;
        height: 10px;
        background: #333;
        border-radius: 5px;
        margin-top: 10px;
        overflow: hidden;
      }
      .progress-fill {
        width: 0%;
        height: 100%;
        background: #009CFF;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading-bar">
        <div>Loading Backrooms Recovery...</div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      </div>
    </div>
    <script src="Build/Game.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#loading-bar");
      var progressFill = document.querySelector("#progress-fill");
      loadingBar.style.display = "block";

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Game.loader.js";
      var config = {
        dataUrl: buildUrl + "/Game.data.unityweb",
        frameworkUrl: buildUrl + "/Game.framework.js.unityweb",
        codeUrl: buildUrl + "/Game.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Backrooms Recovery",
        productVersion: "1.0",
      };

      createUnityInstance(canvas, config, function(progress) {
        progressFill.style.width = (100 * progress) + "%";
      }).then(function(unityInstance) {
        window.unityInstance = unityInstance;
        loadingBar.style.display = "none";
        if (typeof PokiSDK !== "undefined" && PokiSDK.gameLoadingFinished) {
          PokiSDK.gameLoadingFinished();
        }
      }).catch(function(message) {
        console.error("Unity Load Error:", message);
      });
    </script>
  </body>
</html>
